services:
  lab:
    build: .
    container_name: lab
    working_dir: /workspace
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:6006:6006"
    volumes:
      - .:/workspace
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-dev}
    command:
      - jupyter
      - notebook
      - --notebook-dir=/workspace
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --IdentityProvider.token=${JUPYTER_TOKEN:-dev}
    restart: unless-stopped